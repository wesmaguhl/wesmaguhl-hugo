{{ define "main" }}
<div style="margin-top: 5rem; padding: 2rem;">
    <div style="max-width: 900px; margin: 0 auto;">
        <div class="about-container">
            <article class="about-content">
                <div class="terminal-header">
                    <div class="terminal-buttons">
                        <span class="btn-close"></span>
                        <span class="btn-minimize"></span>
                        <span class="btn-maximize"></span>
                    </div>
                    <div class="terminal-title">{{ .Title }}.md</div>
                </div>
                <div class="terminal-body">
                    <div class="prompt-line">
                        <span class="prompt">$</span>
                        <span class="command">cat {{ .Title }}.md</span>
                    </div>
                    <div class="content">
                        {{ .Content }}
                    </div>
                    <!-- Gallery Section -->
                    <div class="about-gallery-section">
                        <div class="prompt-line">
                            <span class="prompt">$</span>
                            <span class="command">ls -la photos/</span>
                        </div>
                        <div class="about-gallery-grid">
                            <div class="about-gallery-item">
                                <img src="https://res.cloudinary.com/dxxma3qih/image/upload/v1766418501/1-N0D9A_tfovkc.webp" alt="Vincent" loading="lazy">
                            </div>
                            <div class="about-gallery-item">
                                <img src="https://res.cloudinary.com/dxxma3qih/image/upload/v1766418501/2-6zEC-_xoilhf.webp" alt="Marjorie" loading="lazy">
                            </div>
                            <div class="about-gallery-item">
                                <img src="https://res.cloudinary.com/dxxma3qih/image/upload/v1766418502/3-4JaTN_lxa2oi.webp" alt="Pierrot" loading="lazy">
                            </div>
                            <div class="about-gallery-item">
                                <img src="https://res.cloudinary.com/dxxma3qih/image/upload/v1766418508/6-RFobo_ripduc.webp" alt="Fabien" loading="lazy">
                            </div>
                            <div class="about-gallery-item">
                                <img src="https://res.cloudinary.com/dxxma3qih/image/upload/v1766418507/5-9JSJC_vtc3cd.webp" alt="Loïc" loading="lazy">
                            </div>
                            <div class="about-gallery-item">
                                <img src="https://res.cloudinary.com/dxxma3qih/image/upload/v1766418503/4-y8Xfk_znthhy.webp" alt="Maxence" loading="lazy">
                            </div>
                        </div>
                    </div>
                    
                    
                    <div class="contact-section">
                        <div class="prompt-line">
                            <span class="prompt">$</span>
                            <span class="command">ls -la contact/</span>
                        </div>
                        <div class="contact-grid">
                            {{ range .Site.Params.contact }}
                            <div class="contact-file">
                                <span class="file-icon">{{ .icon }}</span>
                                <span class="file-name">{{ .name | lower }}.txt</span>
                                <span class="file-content">{{ .value }}</span>
                            </div>
                            {{ end }}
                        </div>
                    </div>
                </div>
            </article>
        </div>
    </div>
</div>
{{ end }}
