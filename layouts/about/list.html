{{ define "main" }}
<div style="margin-top: 5rem; padding: 2rem;">
    <div style="max-width: 900px; margin: 0 auto;">
        <div style="text-align: center; margin-bottom: 3rem;">
            {{ with resources.Get "images/wesmaguhl-titre-crew.webp" }}
            <img src="{{ .RelPermalink }}" alt="Wesmacrew" style="max-width: 400px; width: 100%; height: auto; margin-bottom: 1rem;">
            {{ end }}
        </div>

        <div class="about-container">
            <article class="about-content">
                <div class="parchment-header">
                    <div class="parchment-decoration-left"></div>
                    <div class="parchment-title">{{ .Title }}</div>
                    <div class="parchment-decoration-right"></div>
                </div>
                <div class="parchment-body">
                    <div class="content">
                        {{ .Content }}
                    </div>
                    
                    <div class="contact-section">
                        <div class="section-divider"></div>
                        <h3 class="contact-title">Contact</h3>
                        <div class="contact-grid">
                            {{ range .Site.Params.contact }}
                            <div class="contact-file">
                                <span class="file-icon">{{ .icon }}</span>
                                <span class="file-name">{{ .name | lower }}</span>
                                <span class="file-content">{{ .value }}</span>
                            </div>
                            {{ end }}
                        </div>
                    </div>
                </div>
            </article>
        </div>
    </div>
</div>
{{ end }}
