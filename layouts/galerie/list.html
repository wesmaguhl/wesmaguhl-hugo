{{ define "main" }}
<div style="margin-top: 5rem; padding: 2rem;">
    <div style="max-width: 1200px; margin: 0 auto;">
        <div style="text-align: center; margin-bottom: 3rem;">
            <h1 style="color: var(--primary-color); font-size: 3rem; margin-bottom: 1rem;">{{ .Title }}</h1>
        </div>
        
        <div class="gallery-grid">
            {{- $cloudName := .Site.Params.cloudinary.cloudName -}}
            {{- $images := .Site.Params.cloudinary.images -}}
            
            {{- range $images -}}
            <div class="gallery-item">
                <img 
                    src="https://res.cloudinary.com/{{ $cloudName }}/image/upload/c_fill,w_400,h_300,q_auto,f_auto/{{ . }}"
                    data-full="https://res.cloudinary.com/{{ $cloudName }}/image/upload/q_auto,f_auto/{{ . }}"
                    alt="Photo Wesmaguhl"
                    loading="lazy">
            </div>
            {{- end -}}
        </div>

        <div class="photo-credit">
            <p>Crédits photo : Simon Morice Media, Bnji, Ludovic Dumont</p>
        </div>
    </div>
</div>

<!-- Modal pour affichage plein écran -->
<div id="imageModal" class="modal">
    <span class="close">&times;</span>
    <img class="modal-content" id="modalImg">
</div>

<style>
.gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 1.5rem;
    margin: 2rem 0;
}

.gallery-item {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    cursor: pointer;
    aspect-ratio: 4/3;
}

.gallery-item img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s ease;
}

.gallery-item:hover img {
    transform: scale(1.05);
}

.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.9);
}

.modal-content {
    margin: auto;
    display: block;
    max-width: 90%;
    max-height: 90%;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

.close {
    position: absolute;
    top: 15px;
    right: 35px;
    color: #f1f1f1;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
}

.photo-credit {
    text-align: center;
    margin-top: 3rem;
    font-style: italic;
    color: #666;
}

@media (max-width: 768px) {
    .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1rem;
    }
}
</style>

<script>
// Modal functionality
const modal = document.getElementById('imageModal');
const modalImg = document.getElementById('modalImg');
const galleryItems = document.querySelectorAll('.gallery-item img');

galleryItems.forEach(img => {
    img.addEventListener('click', function() {
        modal.style.display = 'block';
        modalImg.src = this.dataset.full;
    });
});

document.querySelector('.close').addEventListener('click', () => {
    modal.style.display = 'none';
});

modal.addEventListener('click', (e) => {
    if (e.target === modal) {
        modal.style.display = 'none';
    }
});
</script>
{{ end }}
