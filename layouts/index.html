{{ define "main" }}
<!-- Particles container -->
<div id="particles" class="particles"></div>

<section class="hero" style="
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background-color: black;
">
    <!-- Background Video via Cloudinary Player -->
    <iframe
        id="heroVideo"
        src="https://player.cloudinary.com/embed/?cloud_name=dxxma3qih&public_id=clip-acceuil_t2km7p&profile=cld-looping&controls=false&showLogo=false"
        style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 0;
            opacity: 1;
            transition: opacity 2.5s ease-in-out;
            pointer-events: none;
        "
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen
    ></iframe>
    
    <!-- Background Image (hidden by default) -->
    <div id="heroImage" class="album-image" style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('https://res.cloudinary.com/dxxma3qih/image/upload/v1767866512/album_bg_fqc6mb.webp');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 0;
        opacity: 0;
        transition: opacity 2.5s ease-in-out;
    "></div>
    
    <!-- Overlay pour améliorer la lisibilité du texte -->
    <div style="
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1;
    "></div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const videoFrame = document.getElementById('heroVideo');
            const image = document.getElementById('heroImage');
            
            function cycleMedia() {
                // Show video for 10 seconds
                videoFrame.style.opacity = '1';
                image.style.opacity = '0';
                image.classList.remove('animating');
                
                setTimeout(function() {
                    // Hide video, show image
                    videoFrame.style.opacity = '0';
                    image.style.opacity = '1';
                    
                    // Start brightness animation on image
                    setTimeout(function() {
                        image.classList.add('animating');
                    }, 100); // Small delay to ensure opacity transition completes
                    
                    // Show image for 15 seconds
                    setTimeout(function() {
                        // Reload iframe to restart video
                        const src = videoFrame.src;
                        videoFrame.src = src;
                        
                        // Restart cycle
                        cycleMedia();
                    }, 15000); // 15 seconds for image
                }, 10000); // 10 seconds for video
            }
            
            // Start the cycle
            cycleMedia();
        });
    </script>
    
    <div class="hero-content" style="position: relative; z-index: 10; text-align: center;">
        <img src="https://res.cloudinary.com/{{ .Site.Params.cloudinary.cloudName }}/image/upload/v1766392307/wesmaghul-1FFwC_ymxzrw.webp" 
             alt="Wesmaguhl" 
             style="max-width: 500px; width: 100%; height: auto; margin: 0 auto 2rem auto; display: block; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.8));">
        <p class="title-font">{{ .Site.Params.subtitle | default "Metal • Flute • Pagan" }}</p>
    </div>
    
    <!-- Social Media Links -->
    <div class="social-links" style="position: absolute; bottom: 140px; left: 0; right: 0; z-index: 10; margin-top: 2rem; display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; align-items: center;">
        <a href="https://www.facebook.com/wesmaguhl" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" aria-label="Facebook">
            <i class="fab fa-facebook-f"></i>
        </a>
        <a href="https://www.instagram.com/wesmaguhl/" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" aria-label="Instagram">
            <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.tiktok.com/@wesmaguhl" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" aria-label="TikTok">
            <i class="fab fa-tiktok"></i>
        </a>
        <a href="https://www.youtube.com/@wesmaguhl" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" aria-label="YouTube">
            <i class="fab fa-youtube"></i>
        </a>
        <a href="https://open.spotify.com/intl-fr/artist/5qFC8CMfzTr7wB6JSH3sBM" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" aria-label="Spotify">
            <i class="fab fa-spotify"></i>
        </a>
        <a href="https://www.deezer.com/fr/artist/163815287" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" aria-label="Deezer">
            <i class="fab fa-deezer"></i>
        </a>
    </div>
    
    <div class="social-links" style="position: absolute; bottom: 50px; left: 0; right: 0; z-index: 10; margin-top: 2rem; display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; align-items: center;">
        <button onclick="openContactModal()" class="btn btn-primary" aria-label="{{ i18n "program_us" }}" style="cursor: pointer;">
            {{ i18n "program_us" }}
        </button>
    </div>
    
    <!-- Modal de contact -->
    <div id="contactModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: 9999; align-items: center; justify-content: center;">
        <div style="background: var(--bg-secondary); border-radius: 15px; padding: 2rem; max-width: 400px; border: 1px solid var(--glass-border); position: relative;">
            <button onclick="closeContactModal()" style="position: absolute; top: 10px; right: 10px; background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer; padding: 0.5rem;" aria-label="Fermer">×</button>
            
            <h2 style="color: var(--primary-color); margin-bottom: 1.5rem; text-align: center;">{{ i18n "contact" }}</h2>
            
            <p style="text-align: center; margin-bottom: 1.5rem; color: var(--text-secondary);">Choisissez comment nous contacter :</p>
            
            <div style="display: flex; justify-content: space-around; gap: 2rem;">
                <!-- Mailto -->
                <div style="text-align: center;">
                    <a href="mailto:wesmaguhl.officiel@gmail.com" 
                       style="color: var(--primary-color); transition: var(--transition); font-size: 2.5rem; display: block;" 
                       aria-label="Ouvrir dans le client email"
                       title="Client email">
                        <i class="fas fa-envelope"></i>
                    </a>
                    <p style="font-size: 0.85rem; margin-top: 0.5rem; color: var(--text-secondary);">Client email</p>
                </div>
                
                <!-- Gmail -->
                <div style="text-align: center;">
                    <a href="https://mail.google.com/mail/?view=cm&to=wesmaguhl.officiel@gmail.com" 
                       target="_blank" 
                       rel="noopener noreferrer" 
                       style="color: var(--primary-color); transition: var(--transition); font-size: 2.5rem; display: block;" 
                       aria-label="Ouvrir dans Gmail"
                       title="Gmail">
                        <i class="fab fa-google"></i>
                    </a>
                    <p style="font-size: 0.85rem; margin-top: 0.5rem; color: var(--text-secondary);">Gmail</p>
                </div>
                
                <!-- Copier -->
                <div style="text-align: center;">
                    <a href="#" 
                       onclick="copyEmailInModal(event)" 
                       id="copyEmailModalBtn"
                       style="color: var(--primary-color); transition: var(--transition); font-size: 2.5rem; display: block; cursor: pointer;" 
                       aria-label="Copier l'adresse"
                       title="Copier">
                        <i class="fas fa-copy"></i>
                    </a>
                    <p id="copyModalLabel" style="font-size: 0.85rem; margin-top: 0.5rem; color: var(--text-secondary);">Copier</p>
                </div>
            </div>
            
            <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-primary);">wesmaguhl.officiel@gmail.com</p>
        </div>
    </div>
    

    <!-- Footer intégré dans la page d'accueil -->
    <div style="position: absolute; bottom: 20px; left: 0; right: 0; z-index: 10; text-align: center;">
        <p style="color: rgba(255, 255, 255, 0.6); margin: 0; font-size: 0.9rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);">
            Copyright © {{ now.Year }} • {{ .Site.Params.author }}
        </p>
    </div>
</section>

<script>
function openContactModal() {
    document.getElementById('contactModal').style.display = 'flex';
}

function closeContactModal() {
    document.getElementById('contactModal').style.display = 'none';
}

function copyEmailInModal(e) {
    e.preventDefault();
    const email = 'wesmaguhl.officiel@gmail.com';
    const btn = document.getElementById('copyEmailModalBtn');
    const label = document.getElementById('copyModalLabel');
    
    navigator.clipboard.writeText(email).then(function() {
        const originalHTML = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-check"></i>';
        btn.style.color = 'var(--blue-accent-color)';
        label.textContent = 'Copié !';
        label.style.color = 'var(--primary-color)';
        
        setTimeout(function() {
            btn.innerHTML = originalHTML;
            btn.style.color = 'var(--primary-color)';
            label.textContent = 'Copier';
            label.style.color = 'var(--text-secondary)';
        }, 2000);
    }).catch(function() {
        alert('Email : wesmaguhl.officiel@gmail.com');
    });
}

// Fermer le modal en cliquant à l'extérieur
document.addEventListener('click', function(event) {
    const modal = document.getElementById('contactModal');
    if (event.target === modal) {
        closeContactModal();
    }
});

// Fermer le modal avec la touche Escape
document.addEventListener('keydown', function(event) {
    if (event.key === 'Escape') {
        closeContactModal();
    }
});
</script>
    

<style>
/* Social Media Links Styles */
.social-links {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
    align-items: center;
}

.social-links .btn-secondary {
    border: none;
    background: transparent;
    padding: 0;
}

/* Social Media Brand Colors - Icons only */
.social-links .fab{
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-size: 2rem;
}

/* Pulse animation on hover */
@keyframes pulse {
    0%, 100% {
        transform: translateY(-5px) scale(1.1);
    }
    50% {
        transform: translateY(-5px) scale(1.15);
    }
}

/* Album image brightness animation */
@keyframes brightnessAnimation {
    0% {
        filter: brightness(0.7);
    }
    50% {
        filter: brightness(1.3);
    }
    100% {
        filter: brightness(0.7);
    }
}

.album-image.animating {
    animation: brightnessAnimation 3s ease-in-out infinite;
}

/* Ajustement pour mobile */
@media (max-width: 768px) {
    .hero {
        background-attachment: scroll !important;
    }
    
    .hero-content img {
        max-width: 300px !important;
    }
    
    .hero-content p {
        font-size: 1rem !important;
    }
    
    .social-links {
        gap: 1rem;
    }
    
    .social-btn {
        width: 50px;
        height: 50px;
        font-size: 1.2rem;
    }
}

/* Effet parallax sur desktop */
@media (min-width: 769px) {
    .hero {
        background-attachment: fixed;
    }
}
</style>
{{ end }}
