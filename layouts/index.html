{{ define "main" }}
<!-- Particles container -->
<div id="particles" class="particles"></div>

<section class="hero" style="
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background-color: black;
">
    <!-- Background Video via Cloudinary Player -->
    <iframe
        id="heroVideo"
        src="https://player.cloudinary.com/embed/?cloud_name=dxxma3qih&public_id=teaser_clip_elf_long_d0ud4f&profile=cld-looping&controls=false&showLogo=false"
        style="
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            z-index: 0;
            opacity: 1;
            transition: opacity 2.5s ease-in-out;
            pointer-events: none;
        "
        allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
        allowfullscreen
    ></iframe>
    
    <!-- Background Image (hidden by default) -->
    <div id="heroImage" class="album-image" style="
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-image: url('https://res.cloudinary.com/dxxma3qih/image/upload/v1767866512/album_bg_fqc6mb.webp');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        z-index: 0;
        opacity: 0;
        transition: opacity 2.5s ease-in-out;
    "></div>
    
    <!-- Overlay pour améliorer la lisibilité du texte -->
    <div style="
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1;
    "></div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const videoFrame = document.getElementById('heroVideo');
            const image = document.getElementById('heroImage');
            
            function cycleMedia() {
                // Show video for 10 seconds
                videoFrame.style.opacity = '1';
                image.style.opacity = '0';
                image.classList.remove('animating');
                
                setTimeout(function() {
                    // Hide video, show image
                    videoFrame.style.opacity = '0';
                    image.style.opacity = '1';
                    
                    // Start brightness animation on image
                    setTimeout(function() {
                        image.classList.add('animating');
                    }, 100); // Small delay to ensure opacity transition completes
                    
                    // Show image for 15 seconds
                    setTimeout(function() {
                        // Reload iframe to restart video
                        const src = videoFrame.src;
                        videoFrame.src = src;
                        
                        // Restart cycle
                        cycleMedia();
                    }, 15000); // 15 seconds for image
                }, 20000); // 20 seconds for video
            }
            
            // Start the cycle
            cycleMedia();
        });
    </script>
    
    <div class="hero-content" style="position: relative; z-index: 10; text-align: center;">
        <img src="https://res.cloudinary.com/{{ .Site.Params.cloudinary.cloudName }}/image/upload/v1766392307/wesmaghul-1FFwC_ymxzrw.webp" 
             alt="Wesmaguhl" 
             style="max-width: 500px; width: 100%; height: auto; margin: 0 auto 2rem auto; display: block; filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.8));">
        <p class="title-font">{{ .Site.Params.subtitle | default "Metal • Flute • Pagan" }}</p>
    </div>
    
    <!-- Social Media Links -->
    <div class="social-links hero-social-links-bar" style="position: absolute; bottom: 140px; left: 0; right: 0; z-index: 10; margin-top: 2rem; display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap; align-items: center;">
        <a href="https://www.facebook.com/wesmaguhl" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" aria-label="Facebook">
            <i class="fab fa-facebook-f"></i>
        </a>
        <a href="https://www.instagram.com/wesmaguhl/" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" aria-label="Instagram">
            <i class="fab fa-instagram"></i>
        </a>
        <a href="https://www.tiktok.com/@wesmaguhl" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" aria-label="TikTok">
            <i class="fab fa-tiktok"></i>
        </a>
        <a href="https://www.youtube.com/@wesmaguhl" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" aria-label="YouTube">
            <i class="fab fa-youtube"></i>
        </a>
        <a href="https://open.spotify.com/intl-fr/artist/5qFC8CMfzTr7wB6JSH3sBM" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" aria-label="Spotify">
            <i class="fab fa-spotify"></i>
        </a>
        <a href="https://www.deezer.com/fr/artist/163815287" target="_blank" rel="noopener noreferrer" class="btn btn-secondary" aria-label="Deezer">
            <i class="fab fa-deezer"></i>
        </a>
    </div>
    
    <div class="hero-cta-wrapper" style="position: absolute; bottom: 50px; left: 0; right: 0; z-index: 10; display: flex; justify-content: center; flex-wrap: wrap; align-items: center;">
        <div class="hero-cta-group">
            <button onclick="openContactModal()" class="hero-cta-btn hero-cta-primary" aria-label="{{ i18n "program_us" }}">
                <i class="fas fa-calendar-alt"></i>
                <span>{{ i18n "program_us" }}</span>
            </button>
            <div class="hero-cta-divider"></div>
            <a href="https://www.youtube.com/watch?v=RgFLr4Crwng&list=RDRgFLr4Crwng" target="_blank" rel="noopener noreferrer" class="hero-cta-btn hero-cta-secondary" aria-label="{{ i18n "our_last_clip" }}">
                <i class="fas fa-play"></i>
                <span>{{ i18n "our_last_clip" }}</span>
            </a>
        </div>
    </div>    

    <!-- Footer intégré dans la page d'accueil -->
    <div style="position: absolute; bottom: 20px; left: 0; right: 0; z-index: 10; text-align: center;">
        <p style="color: rgba(255, 255, 255, 0.6); margin: 0; font-size: 0.9rem; text-shadow: 1px 1px 2px rgba(0,0,0,0.8);">
            Copyright © {{ now.Year }} • {{ .Site.Params.author }}
        </p>
    </div>
</section>

<style>
/* Social Media Links Styles */
.social-links {
    display: flex;
    gap: 1.5rem;
    justify-content: center;
    flex-wrap: wrap;
    align-items: center;
}

.social-links .btn-secondary {
    border: none;
    background: transparent;
    padding: 0;
}

/* Social Media Brand Colors - Icons only */
.social-links .fab{
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-size: 2rem;
}

/* Pulse animation on hover */
@keyframes pulse {
    0%, 100% {
        transform: translateY(-5px) scale(1.1);
    }
    50% {
        transform: translateY(-5px) scale(1.15);
    }
}

/* Album image brightness animation */
@keyframes brightnessAnimation {
    0% {
        filter: brightness(0.7);
    }
    50% {
        filter: brightness(1.3);
    }
    100% {
        filter: brightness(0.7);
    }
}

.album-image.animating {
    animation: brightnessAnimation 3s ease-in-out infinite;
}

/* Ajustement pour mobile */
@media (max-width: 768px) {
    .hero {
        background-attachment: scroll !important;
    }
    
    .hero-content img {
        max-width: 300px !important;
    }
    
    .hero-content p {
        font-size: 1rem !important;
    }
    
    .social-links {
        gap: 1rem;
    }
    
    .social-btn {
        width: 50px;
        height: 50px;
        font-size: 1.2rem;
    }
}

/* Effet parallax sur desktop */
@media (min-width: 769px) {
    .hero {
        background-attachment: fixed;
    }
}

/* Hero CTA Button Group */
.hero-cta-group {
    display: inline-flex;
    align-items: stretch;
    border-radius: 50px;
    overflow: hidden;
    border: 1px solid rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255,255,255,0.05) inset;
    background: rgba(0, 0, 0, 0.35);
}

.hero-cta-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    padding: 0.8rem 1.6rem;
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: background 0.25s ease, color 0.25s ease;
    white-space: nowrap;
}

.hero-cta-btn i {
    font-size: 0.9rem;
    flex-shrink: 0;
}

.hero-cta-primary {
    background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
    color: #fff;
}

.hero-cta-primary:hover {
    filter: brightness(1.15);
}

.hero-cta-secondary {
    background: transparent;
    color: rgba(255, 255, 255, 0.85);
}

.hero-cta-secondary:hover {
    background: rgba(255, 255, 255, 0.12);
    color: #fff;
}

.hero-cta-divider {
    width: 1px;
    background: rgba(255, 255, 255, 0.2);
    flex-shrink: 0;
    align-self: stretch;
}

@media (max-width: 768px) {
    /* Remonte les icônes sociales pour laisser de la place aux boutons CTA */
    .hero-social-links-bar {
        bottom: 185px !important;
    }
    .hero-cta-wrapper {
        bottom: 55px !important;
    }
}

@media (max-width: 480px) {
    .hero-social-links-bar {
        bottom: 210px !important;
    }
    .hero-cta-group {
        flex-direction: column;
        border-radius: 16px;
    }
    .hero-cta-divider {
        width: auto;
        height: 1px;
    }
    .hero-cta-btn {
        justify-content: center;
    }
}
</style>
{{ end }}
